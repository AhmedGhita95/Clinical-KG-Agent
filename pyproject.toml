[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-kg-agent"
version = "0.1.0"
description = "Local ontology-grounded knowledge graphs for clinical videos"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "gradio>=5.16,<6",
    "pillow>=11,<13",
    "pydantic>=2.10,<3",
    "pyshacl>=0.30,<1",
    "pyvis>=0.3.2,<0.4",
    "python-dotenv>=1.0,<2",
    "rdflib>=7.1,<8",
]

[project.optional-dependencies]
full = [
    "accelerate>=1.3,<2",
    "av>=14,<16",
    "lightrag-hku>=1.5.7,<1.6",
    "qwen-vl-utils>=0.0.8,<0.1",
    "sentence-transformers>=3.4,<4",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "transformers>=4.49,<5",
]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
